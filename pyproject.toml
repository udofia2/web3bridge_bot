[project]
name = "telegram-admin-bot"
version = "2.0.0"
description = "Telegram group admin bot with topic moderation"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot==22.7",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.4",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
